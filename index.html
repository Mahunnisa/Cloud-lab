<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact List</title>
<style>
  :root {
    --bg: #f5f7f6;
    --card: #ffffff;
    --ink: #1b2422;
    --muted: #6b7773;
    --line: #dde3e0;
    --accent: #0f766e;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 16px;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  form {
    display: grid;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  label { font-size: .85rem; color: var(--muted); display: grid; gap: 4px; }
  input {
    font: inherit;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 14px;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  ul { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  li.editing { border-color: var(--accent); }
  .info { min-width: 0; }
  .info strong, .info span { display: block; overflow-wrap: anywhere; }
  .info span { color: var(--muted); font-size: .9rem; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { color: var(--muted); justify-content: center; }
  #error { color: var(--danger); font-size: .9rem; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1>Contact List</h1>

  <form id="form">
    <label>Name
      <input id="name" required maxlength="60" autocomplete="off">
    </label>
    <label>Contact
      <input id="contact" required maxlength="80" autocomplete="off" placeholder="Phone or email">
    </label>
    <div class="row">
      <button type="submit" class="primary" id="submitBtn">Add contact</button>
      <button type="button" id="cancelBtn" hidden>Cancel</button>
    </div>
  </form>

  <div id="error" role="alert"></div>
  <ul id="list"></ul>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyDj5KEmqhGH1chCsgTd7yPtqZyDUFCg2cQ",
    authDomain: "cloud-lab-464f1.firebaseapp.com",
    projectId: "cloud-lab-464f1",
    storageBucket: "cloud-lab-464f1.firebasestorage.app",
    messagingSenderId: "1083703327416",
    appId: "1:1083703327416:web:a327452329d3f5819e524d"
  };

  const app = initializeApp(firebaseConfig);

// Initialize Firebase
  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);
  const col = collection(db, "contacts");

  const form = document.getElementById("form");
  const nameEl = document.getElementById("name");
  const contactEl = document.getElementById("contact");
  const submitBtn = document.getElementById("submitBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const listEl = document.getElementById("list");
  const errorEl = document.getElementById("error");

  let contacts = [];
  let editingId = null;

  function showError(msg) { errorEl.textContent = msg || ""; }

  function resetForm() {
    editingId = null;
    form.reset();
    submitBtn.textContent = "Add contact";
    cancelBtn.hidden = true;
  }

  function render() {
    listEl.innerHTML = "";
    if (!contacts.length) {
      listEl.innerHTML = '<li class="empty">No contacts yet. Add one above.</li>';
      return;
    }
    contacts.forEach(c => {
      const li = document.createElement("li");
      if (c.id === editingId) li.className = "editing";

      const info = document.createElement("div");
      info.className = "info";
      const n = document.createElement("strong");
      n.textContent = c.name;
      const t = document.createElement("span");
      t.textContent = c.contact;
      info.append(n, t);

      const actions = document.createElement("div");
      actions.className = "actions";
      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.onclick = () => startEdit(c.id);
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "danger";
      del.onclick = () => remove(c.id);
      actions.append(edit, del);

      li.append(info, actions);
      listEl.append(li);
    });
  }

  function startEdit(id) {
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    nameEl.value = c.name;
    contactEl.value = c.contact;
    submitBtn.textContent = "Save changes";
    cancelBtn.hidden = false;
    nameEl.focus();
    render();
  }

  async function remove(id) {
    showError("");
    try {
      await deleteDoc(doc(db, "contacts", id));
      if (editingId === id) resetForm();
    } catch (err) {
      showError("Could not delete: " + err.message);
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = nameEl.value.trim();
    const contact = contactEl.value.trim();
    if (!name || !contact) return;

    showError("");
    submitBtn.disabled = true;
    try {
      if (editingId) {
        await updateDoc(doc(db, "contacts", editingId), { name, contact });
      } else {
        await addDoc(col, { name, contact, createdAt: serverTimestamp() });
      }
      resetForm();
    } catch (err) {
      showError("Could not save: " + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  cancelBtn.addEventListener("click", () => { resetForm(); render(); });

  // Live updates from Firestore
  onSnapshot(
    query(col, orderBy("createdAt", "asc")),
    snap => {
      contacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    },
    err => showError("Could not load contacts: " + err.message)
  );

  render();
</script>
</body>
</html>
